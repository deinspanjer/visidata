name: ai-human-review-gate

on:
  pull_request:
    branches:
      - stable
      - develop
    types:
      - opened
      - synchronize
      - edited
      - ready_for_review

jobs:
  validate-human-review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AI-assisted human review gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 dev/checks/validate_human_review_gate.py \
            --pr-body "$PR_BODY" \
            --head-sha "$HEAD_SHA" \
            --canary "agent-human-workflow.md"
